<!-- @dsCard group="Spacing" viewport="700x200" name="Elevation" subtitle="Cool navy-tinted shadows — never pure black" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-muted);padding:30px 24px;font-family:var(--font-body)}
  .row{display:flex;gap:22px;align-items:center}
  .item{text-align:center}
  .box{width:96px;height:64px;background:#fff;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
  .n{font-size:11.5px;font-weight:700;color:var(--text-strong);margin-top:12px}
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)">sm</div><div class="n">card rest</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-md)">md</div><div class="n">card hover</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)">lg</div><div class="n">popover</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-primary);background:var(--color-primary);color:#fff">primary</div><div class="n">CTA lift</div></div>
  </div>
</body></html>
