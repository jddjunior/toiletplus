<!-- @dsCard group="Brand" viewport="700x230" name="Logo" subtitle="Mark + wordmark lockups, light & dark" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-page);padding:22px;font-family:var(--font-body)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .panel{border:1px solid var(--border-soft);border-radius:var(--radius-md);padding:22px;display:flex;align-items:center;gap:14px}
  .panel.dark{background:var(--surface-navy);border-color:transparent}
  .lockup{display:flex;align-items:center;gap:12px}
  .word{font-family:var(--font-display);font-weight:900;font-size:30px;letter-spacing:-.02em;color:var(--text-strong);line-height:1}
  .word .plus{color:var(--color-primary)}
  .word.on-dark{color:#fff}
  .word.on-dark .plus{color:var(--color-accent)}
  .tag{font-size:11px;color:var(--text-muted);font-family:var(--font-mono);margin-top:4px}
</style></head>
<body>
  <div class="grid">
    <div class="panel"><img src="../assets/logo-mark.svg" width="52" height="52"><div><div class="word">Toilet<span class="plus">+</span></div><div class="tag">primary lockup</div></div></div>
    <div class="panel dark"><img src="../assets/logo-mark-white.svg" width="52" height="52"><div><div class="word on-dark">Toilet<span class="plus">+</span></div><div class="tag" style="color:var(--text-on-dark-muted)">reversed — footer / hero</div></div></div>
    <div class="panel" style="justify-content:center"><img src="../assets/logo-mark.svg" width="44" height="44"></div>
    <div class="panel dark" style="justify-content:center"><img src="../assets/logo-mark-white.svg" width="44" height="44"></div>
  </div>
</body></html>
