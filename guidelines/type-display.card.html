<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-page);padding:24px;font-family:var(--font-body)}
  .stack{display:flex;flex-direction:column;gap:14px}
  .line{display:flex;align-items:baseline;gap:16px}
  .spec{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);width:120px;flex:none}
  .d{font-family:var(--font-display);color:var(--text-strong);letter-spacing:var(--ls-display);line-height:1.02;font-weight:800}
</style></head>
<body>
  <div class="stack">
    <div class="line"><span class="spec">76 / 900</span><span class="d" style="font-size:54px;font-weight:900">Burst pipe? We're on it.</span></div>
    <div class="line"><span class="spec">44 / 800</span><span class="d" style="font-size:40px">Trusted local plumbers</span></div>
    <div class="line"><span class="spec">26 / 700</span><span class="d" style="font-size:26px;font-weight:700">Water heater repair &amp; install</span></div>
  </div>
</body></html>
