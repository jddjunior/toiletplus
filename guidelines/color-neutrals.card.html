<!-- @dsCard group="Colors" viewport="700x200" name="Neutrals" subtitle="Cool-gray scale for text, borders & surfaces" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-page);padding:22px;font-family:var(--font-body)}
  .row{display:flex;gap:6px}
  .sw{flex:1;text-align:center}
  .chip{height:54px;border-radius:var(--radius-sm);border:1px solid var(--border-soft)}
  .name{font-size:11px;font-weight:700;color:var(--text-strong);margin-top:6px}
  .hex{font-family:var(--font-mono);font-size:9.5px;color:var(--text-muted)}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--gray-50)"></div><div class="name">50</div><div class="hex">#F5F8FC</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-100)"></div><div class="name">100</div><div class="hex">#EDF1F7</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-200)"></div><div class="name">200</div><div class="hex">#E0E6F0</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-300)"></div><div class="name">300</div><div class="hex">#C9D2E0</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-400)"></div><div class="name">400</div><div class="hex">#98A4B8</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-500)"></div><div class="name">500</div><div class="hex">#6A7689</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-700)"></div><div class="name">700</div><div class="hex">#333C49</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-900)"></div><div class="name">900</div><div class="hex">#0D1217</div></div>
  </div>
</body></html>
