<!-- @dsCard group="Colors" viewport="700x210" name="Semantic Roles" subtitle="Surfaces, text & status mapped to tokens" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-page);padding:22px;font-family:var(--font-body)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tok{display:flex;align-items:center;gap:10px;border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:8px 10px}
  .dot{width:30px;height:30px;border-radius:7px;border:1px solid var(--border-soft);flex:none}
  .k{font-family:var(--font-mono);font-size:11.5px;color:var(--text-strong)}
  .v{font-size:11px;color:var(--text-muted)}
</style></head>
<body>
  <div class="grid">
    <div class="tok"><span class="dot" style="background:var(--surface-brand)"></span><div><div class="k">--surface-brand</div><div class="v">CTAs, primary fills</div></div></div>
    <div class="tok"><span class="dot" style="background:var(--surface-navy)"></span><div><div class="k">--surface-navy</div><div class="v">footer, hero overlay</div></div></div>
    <div class="tok"><span class="dot" style="background:var(--surface-muted)"></span><div><div class="k">--surface-muted</div><div class="v">alt sections</div></div></div>
    <div class="tok"><span class="dot" style="background:var(--color-accent)"></span><div><div class="k">--color-accent</div><div class="v">urgency only</div></div></div>
    <div class="tok"><span class="dot" style="background:var(--green-500)"></span><div><div class="k">--green-500</div><div class="v">licensed / success</div></div></div>
    <div class="tok"><span class="dot" style="background:var(--amber-500)"></span><div><div class="k">--amber-500</div><div class="v">warning / wait</div></div></div>
  </div>
</body></html>
