<!-- @dsCard group="Colors" viewport="700x190" name="Brand Blue" subtitle="Primary plumber blue → deep navy" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-page);padding:22px;font-family:var(--font-body)}
  .row{display:flex;gap:10px}
  .sw{flex:1;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-soft)}
  .chip{height:60px}
  .meta{padding:7px 9px}
  .name{font-size:12px;font-weight:700;color:var(--text-strong)}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);text-transform:uppercase}
  .star{outline:2px solid var(--color-primary);outline-offset:2px;border-radius:var(--radius-sm)}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--blue-100)"></div><div class="meta"><div class="name">100</div><div class="hex">#D2E5FF</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--blue-300)"></div><div class="meta"><div class="name">300</div><div class="hex">#6FA8F5</div></div></div>
    <div class="sw star"><div class="chip" style="background:var(--blue-500)"></div><div class="meta"><div class="name">500 · Primary</div><div class="hex">#1466CC</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--blue-700)"></div><div class="meta"><div class="name">700 · Dark</div><div class="hex">#0B3D7E</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--blue-900)"></div><div class="meta"><div class="name">900 · Navy</div><div class="hex">#071E3D</div></div></div>
  </div>
</body></html>
