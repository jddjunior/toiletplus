<!-- @dsCard group="Type" viewport="700x180" name="Eyebrow & Mono" subtitle="Uppercase overlines + tabular mono for phone & license #s" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-page);padding:24px;font-family:var(--font-body)}
  .stack{display:flex;flex-direction:column;gap:18px}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--color-primary)}
  .eyebrow .dot{color:var(--color-accent)}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text-strong)}
  .spec{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);margin-bottom:4px}
  .big{font-size:24px;font-weight:600}
</style></head>
<body>
  <div class="stack">
    <div>
      <div class="spec">overline · 12 · 700 · 0.14em · uppercase</div>
      <div class="eyebrow">Licensed &amp; Insured <span class="dot">•</span> Same-Day Service</div>
    </div>
    <div>
      <div class="spec">mono · tabular-nums — phone, license, hours</div>
      <div class="big mono">(555) 240-7867 &nbsp;·&nbsp; Lic. #PL-48217</div>
    </div>
  </div>
</body></html>
