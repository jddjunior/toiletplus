<!-- @dsCard group="Colors" viewport="700x190" name="Accent Red" subtitle="Light-red highlight — urgency & emergency only" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-page);padding:22px;font-family:var(--font-body)}
  .row{display:flex;gap:10px;align-items:flex-start}
  .sw{flex:1;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-soft)}
  .chip{height:60px}
  .meta{padding:7px 9px}
  .name{font-size:12px;font-weight:700;color:var(--text-strong)}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);text-transform:uppercase}
  .note{flex:1.4;font-size:12.5px;color:var(--text-muted);line-height:1.5;padding-top:2px}
  .note b{color:var(--color-accent)}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--red-100)"></div><div class="meta"><div class="name">100</div><div class="hex">#FFE2E2</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--red-300)"></div><div class="meta"><div class="name">300</div><div class="hex">#FF9A9A</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--red-500)"></div><div class="meta"><div class="name">500 · Accent</div><div class="hex">#FF4D4D</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--red-600)"></div><div class="meta"><div class="name">600</div><div class="hex">#E63333</div></div></div>
    <div class="note">Reserved for <b>burst-pipe urgency</b>: the 24/7 badge, emergency call-outs, alerts. Never a default button color — overuse kills the alarm.</div>
  </div>
</body></html>
