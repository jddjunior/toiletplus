<!-- @dsCard group="Spacing" viewport="700x180" name="Radii" subtitle="Sturdy soft corners — sm→xl + pill" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-page);padding:24px;font-family:var(--font-body)}
  .row{display:flex;gap:18px;align-items:center}
  .item{text-align:center}
  .box{width:74px;height:62px;background:var(--blue-50);border:2px solid var(--color-primary)}
  .n{font-size:11.5px;font-weight:700;color:var(--text-strong);margin-top:8px}
  .px{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="n">sm</div><div class="px">8px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><div class="n">md · default</div><div class="px">12px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="n">lg</div><div class="px">18px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="n">xl</div><div class="px">24px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-pill);width:100px"></div><div class="n">pill</div><div class="px">999px</div></div>
  </div>
</body></html>
